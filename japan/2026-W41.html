const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYSTORE='board_key_'+D.salt.slice(0,8);
async function keyFromPw(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},km,256);
  return new Uint8Array(bits);
}
// ★ document.open() 은 파서가 아직 도는 중(449KB 페이지 스트리밍 중)에 부르면 무시되고 write 가 본문에 '끼어든다'.
//   반드시 load 이후에만 갈아 끼운다. (2026-09-15 github.io 에서 겪음 — localhost 는 페이지가 작아 안 걸렸다)
const loaded=new Promise(r=>document.readyState==='complete'?r():window.addEventListener('load',r,{once:true}));
async function unlock(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  const html=new TextDecoder().decode(pt);
  await loaded;
  document.open();document.write(html);document.close();
}
(async()=>{try{const s=localStorage.getItem(KEYSTORE);if(s){await unlock(b64(s));}}catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent='';
  try{const raw=await keyFromPw(document.getElementById('pw').value);
      try{localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...raw)))}catch(_){}
      await unlock(raw);}
  catch(e){err.textContent='Wrong password 密码错误';btn.disabled=false;try{localStorage.removeItem(KEYSTORE)}catch(_){}}
});
}
