<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>해운 탈탄소 상황판</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#e2e8f0}
 .box{background:#1e293b;padding:32px 36px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);width:min(92vw,380px)}
 h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#94a3b8;margin:0 0 18px}
 input{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
 button{margin-top:12px;width:100%;padding:10px;font-size:15px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
 button:disabled{opacity:.5}.err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}

</style></head><body>
<form class="box" id="f"><h1>해운 탈탄소 상황판</h1><p class="sub">Updated 2026-10-05 07:42 (Tianjin) · Enter the shared password 请输入密码</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
<button id="go" type="submit">Open</button><div class="err" id="err"></div>
<div class="foot">Encrypted page — nothing is readable without the password. Ask HYUNKI if you don't have it.</div></form>
<script>
// ★ 전역을 남기지 않는다 — 풀린 페이지가 같은 전역에서 돌기 때문에 여기 const D 가 남아 있으면
//   상황판 자신의 `const D=` 가 「이미 선언됨」으로 죽고 빈 화면이 된다(2026-09-23 장기체류판).
{
const D={"salt": "AcRsiuJOdzTt2gH8EsFKMw==", "iv": "oXBCRT1tlAqfcqdI", "ct": "uGWHLKBR1/ciwOEGDoXyOITaDDsrRNsCK6rCWRyjTba8oEQB/q878roj/bQhSFc83pAWLVdYPZ3fot2RDfPRhf3bZ0k7c4E1NgvpDmPfuXerYVr9lmf3q0znxR68+KS8RLPagqDR1LbzRxY5ve7MX3HI6kcBrW90UZHvgnptao/YcEOBKnvbt2mVu6nYaQazS0cDmXtABw1sANHmB0DIKdWmcGavtV9PNaManIfp5EIryl68/GLkswl/z7sVdraHZXlnyvk0D4aJXKS6MeKUBho5cV3lVqQLjAw4yicmSRM79IKg3IHEj7GYSnG7r6nkcNH8yM6FGhdWUUXls+JS0ZSq0sDfRgK5yU7xkuANcYmTc1UtDZXUHka/IQ+lBJQGKozod+QS+EJAV7yxJ+xg2tV1j57tSjK0iKh7+NXEwOL4IfcKTpicbQEhgcUdnMlHzLY65JOZXAmVOQ9ZLFfxZ82JqqcKJZlTb6LmIM2zwfhLw/IlP/iCRKrrWMJkuV2ejJW4y6ryFhuYAZWmTGFLfqG9tgNtD5qsSMeOIxCjc+SmP15YozQTMFM5+sWcZEDAF9VfG3CvYWpDhbac8/xYiOvnQRTOHU4+dqRdxHEBqUPF39EkBK/kOInfsljgOPLAsyggJ7zJLfs68L4IZ163G1x3si5oeXoBt0/cFzTiKR9ECuThWfRXXa47yexWS3q0zYKTsLjc24/7Mmm2FlGEXx7CnOGl+K4Zal0SpKNX9RTEZvwJNhh64wZJTkgQkL1jNvsRGRpLZZaqOYYm6aR7TEv4yoUXQJL+2KbI+OqOi0U2JXsf8LHqzYLLOH6rl0b6QghWqZy1uoRQOjF+G0waTh9U3VdPNz8nYJSRh5/ZQvOusoh4dlBWP1D945nfd3lIwzxUg7Y39KepvDpzT32GBdiAM/INt2mbpSpzxaoMuoD+7zA2W5L9vKz/hAUY8dPMCXIh", "iter": 300000};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYSTORE='board_key_'+D.salt.slice(0,8);
async function keyFromPw(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},km,256);
  return new Uint8Array(bits);
}
// ★ document.open() 은 파서가 아직 도는 중(449KB 페이지 스트리밍 중)에 부르면 무시되고 write 가 본문에 '끼어든다'.
//   반드시 load 이후에만 갈아 끼운다. (2026-09-15 github.io 에서 겪음 — localhost 는 페이지가 작아 안 걸렸다)
const loaded=new Promise(r=>document.readyState==='complete'?r():window.addEventListener('load',r,{once:true}));
async function unlock(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  const html=new TextDecoder().decode(pt);
  await loaded;
  document.open();document.write(html);document.close();
}
(async()=>{try{const s=localStorage.getItem(KEYSTORE);if(s){await unlock(b64(s));}}catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent='';
  try{const raw=await keyFromPw(document.getElementById('pw').value);
      try{localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...raw)))}catch(_){}
      await unlock(raw);}
  catch(e){err.textContent='Wrong password 密码错误';btn.disabled=false;try{localStorage.removeItem(KEYSTORE)}catch(_){}}
});
}
</script></body></html>
